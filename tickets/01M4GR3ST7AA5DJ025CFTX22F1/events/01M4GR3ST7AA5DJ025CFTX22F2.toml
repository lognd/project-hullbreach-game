body = "ShipController.cs:387-391 (Awake) and 482-494 (ReplaceBlocks). BlockGrid.TryAdd returns false for duplicates, a second core, and BlockKey.Pack (BlockKey.cs:18) aliases x/y outside -128..127 with no check; BlockGrid.TryRemove refuses the core (BlockGrid.cs:144). ReplaceBlocks therefore leaves the old core in place and silently drops the new layout's core (or keeps both layouts' overlap), and returns void so a caller/test cannot tell the resulting ship differs from the requested one. Contract gap: no failure path. Fix: return a Result/bool plus rejected list (or log LogWarning per rejected AuthoredBlock) and range-check via BlockKey.InRange before Pack; for ReplaceBlocks either rebuild the grid (new BlockGrid) or document and reject layouts whose core differs. Same for the inspector 'blocks' array in Awake (validate once, log errors)."
