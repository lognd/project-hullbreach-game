acceptance = ["MinimapModel takes own ship (position, heading), enemy positions, planets (position, radius), optional arena bounds and a minimap size in px, and returns minimap-local blips; it references no UnityEngine type and compiles in tools/plaincs.", "Framing is arena-fixed with uniform scale: the arena bounds touch the minimap edge on the limiting axis and the arena centre maps to the minimap centre within 0.5 px; with no bounds configured the frame fits all ships and planets plus a 10 percent margin.", "Planet blip radius equals world radius times the scale, clamped to a 2 px minimum; own-ship blip heading equals ship heading within 0.5 degrees.", "A ship outside the arena bounds is clamped onto the minimap edge along the ray from the minimap centre and flagged OutOfBounds.", "Own, enemy, planet and bounds blips use distinct named HudColor constants (enemy colour distinct from own).", "MinimapModelTests cover framing, scaling, clamping, heading and the no-bounds fallback and pass under tools/plaincs/run_tests.sh; ui-port.md module reference lists MinimapModel."]
body = "Pure geometry for the S57 minimap, kept engine-free like FlightTelemetryModel/StatusPanelModel so it is testable without Unity. Arena bounds are an input because S41 (arena boundary) is not implemented yet. S45-2 (T-0099) will later add hazard warning blips to this model's output."
