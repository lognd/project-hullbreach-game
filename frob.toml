check_base = "main"

# T-1576: fresh scaffolds start on rapid; one-way auto-ratchet upgrades
# it later (docs/modules/tickets.md#development-profiles-frobtoml-profile-t-1575).
[profile]
profile = "rapid"

# T-3931: set day one so MILE003 never fires with no value to compare.
[tickets]
default_milestone = "0.1.0"

[gates.severity]

# Sized for a fresh, minimal scaffold; raise as the real suite grows.
[testing]
min_unit_cases = 1
min_integration = 1
unit_branch_cov = 50
module_line_cov = 50
system_line_cov = 50

# T-4503: auto-added at runtime too (T-4515); declared here so this
# file stays self-describing without knowing the detection heuristic.
[graph]
exclude = [
"Library/**",
"Temp/**",
"Logs/**",
"obj/**",
"*.meta",
]

# W: `dotnet test .` cannot work here, no root .csproj/.sln in a Unity
# repo; tools/plaincs/run_tests.sh is what actually builds/runs these.
[[test.runner]]
language = "csharp"
command = ["tools/plaincs/run_tests.sh", "--filter", "{filters}"]
all_command = ["tools/plaincs/run_tests.sh"]
cwd = "."

# T-3277: REF001/REF002 flags each of these; read by something outside
# this repo's tracked-file graph, never referenced by name from source.
[[refs.entrypoint]]
path = "design/*.strata"
reason = "generated by frob scaffold unity-project (T-4503) from detected .asmdef files, read by frob's strata elaborator by convention, never referenced by name from tracked source"

[[refs.entrypoint]]
path = "Assets/**/*.asmdef"
reason = "Unity's own assembly-boundary manifest, read by the Unity Editor outside this repo's own tracked-file graph, not referenced from source"

[[refs.entrypoint]]
path = "Packages/manifest.json"
reason = "Unity Package Manager's own manifest, read by the Unity Editor outside this repo's own tracked-file graph, not referenced from source"

[[refs.entrypoint]]
path = "ProjectSettings/*"
reason = "Unity Editor project settings, read by the Unity Editor outside this repo's own tracked-file graph, not referenced from source"
