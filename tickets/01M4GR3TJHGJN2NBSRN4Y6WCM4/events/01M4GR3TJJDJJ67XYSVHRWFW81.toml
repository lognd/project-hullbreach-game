body = "HudPrefabBuilder.cs:59-63 and 203-209. Run -> BuildHudCanvasPrefab -> AddStatusPanel does AssetDatabase.LoadAssetAtPath(ChannelBarPrefabPath) then PrefabUtility.InstantiatePrefab(channelBarPrefab,...) three times, but only BuildChannelBarPrefab (separate -executeMethod entry) creates that asset; Run never calls it. On a project without ChannelBar.prefab the null prefab throws ArgumentNullException mid-build, leaking the temporary HudCanvas GameObject (DestroyImmediate at line 94 never runs) and writing a partial BuilderPanel.prefab so the next Build() skips via the File.Exists guard (line 69) with a broken state. Fix: call BuildChannelBarPrefab(force) first in BuildHudCanvasPrefab, check for null with a returned error, wrap in try/finally to destroy canvasGo, and make the skip guard check all five prefab paths."
at = "2026-10-09T16:32:04Z"
