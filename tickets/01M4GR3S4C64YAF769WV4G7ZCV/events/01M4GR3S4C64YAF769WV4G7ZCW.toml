body = "Powerup.cs:248-265 plus PowerupSpawner.cs:333-336. A ship has one BoxCollider2D per block, so multiple colliders can enter the trigger in the same physics step before Destroy(gameObject) (line 264) executes. Each pass calls Ship.ApplyPowerup (line 259) and PowerupSpawner.NotifyCollected, which starts a RespawnAfterDelay coroutine each time, leaving duplicate pickups at the same preset position and re-applying the variant. Also the NotifyCollected comment claims it is a no-op for a foreign Powerup but it never checks. Fix: add a _collected flag in Powerup set on first success and early-return; make NotifyCollected idempotent per Powerup instance. Test: ship straddling the trigger yields exactly one respawn."
