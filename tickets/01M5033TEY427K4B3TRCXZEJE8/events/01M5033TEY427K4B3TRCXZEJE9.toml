acceptance = ["A direct host started with -hullbreachDirect loads MultiplayerGame and admits players without reordering the build scene list.", "A direct client started with -hullbreachConnect loads MultiplayerGame and reaches Replicated ships: 2 against a direct host without the build-order workaround.", "A Linux dedicated server build loads MultiplayerGame and admits direct clients without the build-order workaround."]
body = "Found while writing the beginner README (PR #52). On main nothing loads MultiplayerGame when the game runs with -hullbreachDirect/-hullbreachConnect/-hullbreachPort or as a dedicated server: only the lobby's START GAME (HullbreachLobbyService) loads it. HullbreachNetCodeServerSystem only puts peers in game once the HullbreachGhostPrefab singleton from the MultiplayerGame subscene exists, so a build that opens on LobbyScene never admits direct peers. README Guides 3 and 5 currently tell people to build with MultiplayerGame as the first scene; remove that workaround from the README when this lands."
