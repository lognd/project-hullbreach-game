[project]
name = "hbtools"
version = "0.1.0"
description = "Project Hullbreach doctor and play scripts: setup checks, builds and launches for beginners."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typani>=0.2.3",
]

[project.scripts]
hb-doctor = "hbtools.__main__:doctor_main"
hb-play = "hbtools.__main__:play_main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hbtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
