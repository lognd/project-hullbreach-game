body = "Found while closing out the backlog. ClientReplica has no projectile state (server projectiles are never sent to clients), so a projectile interpolation test has nothing to exercise; S48-2 only covers ship poses. ClientReplica.LastCorrection measures prediction error but nothing smooths the correction, so there is no behavior to test. Needs a protocol message for projectile state and a smoothing design first; tests follow the design. Not a test-only gap."
