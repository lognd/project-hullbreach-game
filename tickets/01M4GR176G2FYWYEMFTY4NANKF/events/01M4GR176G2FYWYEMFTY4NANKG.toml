labels = ["origin:auditor"]
scope = ["Assets/Scripts/Hullbreach.World/OrbitHelper.cs"]
body = "OrbitHelper.cs:221-233. (1) Failure is indistinguishable from success: invalid bodyIndex (line 223) or position at center (226) returns float2.zero, so Game/OrbitStarter.cs:30 and Game/DemoMode.cs:173 call ResetTo with zero velocity silently (serialized bodyIndex goes stale since GravityField.Remove shifts indices). (2) Negative Mu (repulsive wells are supported, see AntiGravityGunBehaviour WellMu=-40) makes AccelerationMagnitude negative, so math.sqrt(accel*dist) at line 229 is NaN, which then poisons ship state. Fix: return bool TryCircularOrbitVelocity(field, idx, pos, out float2 v) that fails for bad index, center, or Mu<=0 (no circular orbit exists around a repeller); callers log and skip on failure; add tests for each failure."
