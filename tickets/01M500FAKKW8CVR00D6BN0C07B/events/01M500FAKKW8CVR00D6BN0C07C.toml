acceptance = ["EnemyIndicatorModel takes own ship position, enemy positions, camera centre, viewport half-extents (world units), screen size (px) and an inset margin (px), references no UnityEngine type, and returns Mode (Hidden, EdgeArrow, OnScreenMarker), screen position, arrow angle and distance.", "The target is the enemy nearest to the own ship (same rule as IWorldSink.TryNearestEnemy); with no enemies Mode is Hidden.", "When the target lies outside the viewport shrunk by the inset, Mode is EdgeArrow, the position lies on the inset rectangle along the ray from the screen centre to the target within 1 px, and the arrow angle is within 2 degrees of the bearing from the screen centre to the target.", "When the target lies inside the inset viewport, Mode is OnScreenMarker at the target's screen position within 1 px (or Hidden when the marker option is off).", "Distance text is formatted with the invariant culture (passes HudCultureTests style checks).", "EnemyIndicatorModelTests cover all four quadrants, the corners, the inset boundary, the no-enemy case and nearest-enemy selection, and pass under tools/plaincs/run_tests.sh; ui-port.md module reference lists EnemyIndicatorModel."]
