idempotency_key = "audit-game-gravity-destroy"
labels = ["origin:auditor", "audit:hullbreach-game"]
scope = ["Assets/Scripts/Hullbreach.Game/GravityWorld.cs"]
body = "GravityWorld.cs:425-431. The comment says it only clears the static if this instance set it, but the code tests ReferenceEquals(Field, null) and then unconditionally sets Field = null. On a scene reload or additive load where the new GravityWorld.Awake runs before the old one's OnDestroy, the live field is blanked, so ShipController/Projectile/OrbitStarter silently see 'no gravity' (all of them null-tolerate it, so nothing errors). Fix: keep a private field _field set in Awake and only null the static when ReferenceEquals(Field, _field). Test: two GravityWorlds, destroy the older one, assert Field still non-null."
